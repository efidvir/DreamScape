<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamScape</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.4' stop-color='%23bfe3ff'/%3E%3Cstop offset='1' stop-color='%23bfe3ff' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/dream.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="dream" aria-label="The dream"></canvas>

  <header id="status" aria-live="polite">
    <ul id="services"></ul>
  </header>

  <div id="quest" aria-live="polite" hidden><span id="quest-text" dir="auto"></span><span id="quest-steps" aria-hidden="true"></span></div>

  <section id="subtitles" aria-live="polite">
    <p id="player-line" dir="auto"></p>
    <p id="dreamer-line" dir="auto"></p>
  </section>

  <div id="stage" aria-live="polite"></div>
  <div id="notice" role="status"></div>
  <div id="waking" aria-live="polite"></div>
  <div id="waiting" role="status" dir="auto"></div>

  <footer id="controls">
    <form id="typebox" autocomplete="off">
      <input id="say" dir="auto" maxlength="500">
      <button id="send" type="submit" aria-label="Send">↵</button>
    </form>
    <button id="talk" type="button"><span class="ring"></span><span class="core"></span></button>
    <div id="tools">
      <select id="lang" aria-label="Language">
        <option value="auto">Auto</option>
        <option value="he">עברית</option>
        <option value="en">English</option>
      </select>
      <button id="mute" type="button" aria-pressed="false">♪</button>
      <button id="new-dream" type="button"></button>
    </div>
  </footer>

  <div id="timings" hidden></div>

  <div id="veil">
    <div class="card">
      <h1>DreamScape</h1>
      <p id="tagline"></p>
      <button id="enter" type="button"></button>
      <p id="hint" class="hint"></p>
      <div id="veil-status"></div>
    </div>
  </div>

  <div id="fin" hidden>
    <div class="card">
      <p id="fin-text"></p>
      <button id="fin-again" type="button"></button>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
